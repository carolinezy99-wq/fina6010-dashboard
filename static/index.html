<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Morning Meeting Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css?v=75" />
  </head>
  <body>
    <header class="masthead">
      <div class="mast-inner">
        <div class="brand-line">Morning Meeting Dashboard</div>
        <div class="mast-right">
          <div class="clocks" id="clocks"></div>
          <button type="button" id="fs">Full screen</button>
        </div>
      </div>
    </header>
    <div class="shell">
      <div class="standfirst">
        <span class="live"><i id="pulse"></i> Auto-updating market board</span>
        <span id="fresh">Refreshing…</span>
        <button type="button" id="reload">Refresh</button>
      </div>
      <nav class="jump" id="jump"></nav>
      <main id="board"></main>
      <footer class="colophon" id="sources"></footer>
    </div>
    <script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
    <script src="/app.js?v=75"></script>
  </body>
</html>
