<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Market Background</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="bg-page">
    <div class="bg-shell">
      <header class="top">
        <div class="brand">
          <div class="orange">WIRE</div>
          <div class="title-row">
            <div class="title">MARKET BACKGROUND</div>
            <div class="clocks" id="clocks"></div>
          </div>
          <div class="sub">Financial Times · Bloomberg · Reuters</div>
        </div>
        <div class="meta">
          <div class="stamp" id="stamp">LOADING…</div>
        </div>
      </header>
      <section class="wires" id="wires"></section>
    </div>
    <script src="/background.js"></script>
  </body>
</html>
